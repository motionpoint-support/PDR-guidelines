const STEP_HTML = "<div style=\"height: 52px; padding: 0 18px 0 6px; border-radius: 26px; background: #0B2545; color: #FFFFFF; display: flex; align-items: center; gap: 10px; box-shadow: 0 6px 16px rgba(11,37,69,.22); animation: pop 0.78s ease both;\">\n<span class=\"disp\" style=\"width: 40px; height: 40px; border-radius: 20px; background: #5DB645; color: #0B2545; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700;\">{{st.n}}</span>\n<span style=\"font-size: 15px; font-weight: 900; letter-spacing: .06em; text-transform: uppercase;\">Part {{st.n}} of 7</span>\n</div>";
const SUB_OPEN = "<div style=\"position: absolute; left: 48px; right: 48px; top: 0; height: 70px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 22px; line-height: 1.3; font-weight: 700; color: #F4F7FB; animation: up 0.7s ease both;\">";
function fit(){ const s = Math.min(window.innerWidth / 1280, window.innerHeight / 870); document.getElementById('fit').style.transform = 'scale(' + s + ')'; }
window.addEventListener('resize', fit); fit();
class Player {
  constructor() {
    this.state = { scene: 0, el: 0, playing: false, started: false, ended: false, music: true, subsOn: true };
    this.ctx = null;
  }
  durs() { return [24000, 80000, 66000, 59000, 54000, 66000, 76000, 40000]; }
  subLines() {
    return [[[0, "Welcome! This video shows when a support case should become a PDR, a post delivery request."], [6000, "A PDR is a mini project, managed directly by a PM."], [10000, "Your part: spot it, document the reasons, confirm with the CXM, and route it. Then the PM takes over."], [16000, "Once a case is a PDR, the PM handles it directly, and you're no longer involved."]],
      [[0, "Part 1: spot it, with a two-part test."], [2500, "First, this must be true: a functional change is being made to a site that's live, or soon to be live."], [9000, "If that's not true, it's not a PDR."], [12000, "And, at least one of these must also be true."], [15000, "The customer requests a separate invoice for the work."], [20000, "The change needs QA, like a site analysis, a regression test, light QA, or a TCrawl run."], [25000, "The translation volume is significant."], [30000, "The change is big enough to consider adjusting the monthly subscription."], [35000, "Or the work is complex: multiple flows, steps or languages, or long reports with attachments and documents from the customer."], [41000, "MotionPoint QA can run regression tests, then validate the TAM and PE fixes, so the PM can give the customer progressive updates."], [48000, "Part one, plus at least one from the list? It may be a PDR."], [55000, "Keep in mind: a PDR is heavy work, not a quick fix."], [57500, "Fix this URL, translate this page, fix a misalignment: those are simple, single requests. Work them as regular cases."], [65000, "A PDR can hold many requests in one case: translation, functionality, activations, misalignments and customizations."], [70500, "Often across multiple languages."], [74000, "Plus multiple flows and steps, long reports with attachments, and QA regression testing."]],
      [[0, "Part 2: flag it."], [4000, "Anyone on the team can flag a case as a PDR. But only a PM or a CXM can approve it."], [12000, "So flagging isn't approving. Wait for the PM or CXM to decide."], [24000, "First, document the legit reasons in the case: add an internal post and tag the CXM."], [30000, "Say what's changing, list each request, and explain why it's a PDR."], [44000, "Then reach out to the CXM on Teams first, to get their confirmation."], [50000, "Explain the reasons in a short message, like this one, and ask the CXM to confirm."], [56000, "Until the CXM confirms, it's still a regular case."]],
      [[0, "Part 3: route it to the right person."], [4000, "If the change could be big enough to adjust the monthly subscription, send it to the CXM."], [9000, "The CXM evaluates the level of effort, and the last time the customer's MRR was adjusted. If it's a PDR, the PM manages it."], [22000, "If the account has no dedicated PM, or the PM is no longer with MotionPoint, assign the case to the PM team lead."], [29000, "They'll assign a PM to the PDR."], [40000, "And always send these to the CXM: a request to add sections of the site, or another environment, to scope."], [48000, "Those are always a Project, because we may be able to increase MRR."]],
      [[0, "Part 4: what the PM does next. You won't do these steps, but it helps to know them."], [4000, "The PM confirms the details with the customer and fills the PDR case fields."], [9000, "What's changing, how it's tested in English, when and how to access it, when it's complete, when it goes live, and the estimated words and hours."], [18000, "From here on, the PM handles it. Your part is done."], [28000, "Next, the estimate. We prefer a soft estimate, and billing actual costs."], [34000, "The PM asks QA and PE for a work estimate, and adds ten percent for PM time."], [40000, "If the customer insists on a fixed fee, the estimate is padded to cover the risk."], [44000, "PDR work is billable, so everyone involved logs their time with billable notes."]],
      [[0, "Part 5: the PM runs the project to delivery."], [4000, "First, the PM emails the customer: the case has been converted into a PDR, and the PM is now managing it."], [12000, "The PM sets expectations on cost and delivery."], [19000, "Delivery usually takes two to three weeks, adjusted to the scope."], [23000, "The PM sets up a Teams group with Translation, QA and PE, a handoff call if needed, and a deadline for each task."], [34000, "QA runs a site analysis and creates prioritized tickets for PE and Translation."], [39000, "They complete the tickets and return them to QA, and QA updates the TCrawl test cases."], [43000, "Internal work goes in tasks and tickets, never in the case. The case is only for the customer."], [49000, "The PM keeps the PDR report and everyone updated."], [54000, "It's delivered when all tasks are complete, all tickets are closed, and the customer confirms."], [58000, "The PM is the customer's main contact, unless it's urgent or after hours."]],
      [[0, "Part 6: practice. PDR or not?"], [4000, "A new checkout flow on the live site, and the customer asks for a separate invoice."], [9000, "Likely a PDR. Document the reasons, then Teams the CXM to confirm."], [14000, "The customer wants a new section of the site added to translation."], [19000, "Always send it to the CXM. It's a Project."], [24000, "A typo on one translated page."], [29000, "Not a PDR. It's a simple, single request, so work the case as usual."], [34000, "A ten-page document listing issues across several flows and three languages."], [39000, "Likely a PDR. Document the reasons, then Teams the CXM to confirm."], [44000, "A functional change needs a regression test, and the account's PM has left."], [49000, "Flag it, and assign the case to the PM team lead."], [54000, "The change may be big enough to adjust the monthly subscription."], [59000, "Send it to the CXM."], [64000, "The case is a PDR, and the customer replies to you."], [69000, "The PM is the main contact. Only step in if it's urgent or after hours."]],
      [[0, "Recap."], [2500, "Spot it: a functional change on a live, or soon to be live, site."], [5000, "Plus one more sign: a separate invoice, QA, a big translation volume, a change to the subscription, or complex work."], [9000, "Document the reasons in the case, then reach out to the CXM on Teams to confirm, and route it to the right person."], [14000, "No PM? Assign the case to the PM team lead. Then step out."], [17000, "The PM handles the rest, all the way to delivery."], [23000, "Remember: anyone can flag a PDR, but only a PM or CXM can approve it."], [31000, "Thanks for watching!"]]];
  }
  labels() { return ["Intro", "Spot it", "Flag it", "Route it", "PM: confirm", "PM: run", "Practice", "Recap"]; }

  /* ---------- original background jazz, synthesized live ---------- */
  bars() {
    // [bass walk (MIDI), chord voicing (MIDI)] — ii-V-I in F with turnarounds, 80 bpm swing
    return [
      [[43, 46, 50, 47], [58, 62, 65, 69]], // Gm9
      [[48, 46, 43, 40], [58, 62, 64, 69]], // C13
      [[41, 45, 48, 49], [57, 60, 64, 67]], // Fmaj9
      [[50, 48, 45, 44], [54, 60, 64, 69]], // D9
      [[43, 46, 50, 47], [58, 62, 65, 69]], // Gm9
      [[48, 46, 43, 40], [58, 62, 64, 69]], // C13
      [[45, 48, 52, 51], [60, 64, 67, 71]], // Am9
      [[50, 48, 45, 44], [54, 60, 64, 69]]  // D9
    ];
  }
  hz(m) { return 440 * Math.pow(2, (m - 69) / 12); }
  initAudio() {
    if (this.ctx) return true;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      const ctx = new AC();
      const master = ctx.createGain();
      master.gain.value = 0;
      master.connect(ctx.destination);
      const len = Math.floor(ctx.sampleRate * 1.0);
      const noise = ctx.createBuffer(1, len, ctx.sampleRate);
      const data = noise.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      this.ctx = ctx; this.master = master; this.noise = noise;
      this.beat = 0; this.nextT = 0;
      return true;
    } catch (e) { return false; }
  }
  pianoNote(m, t, vel, dur) {
    const c = this.ctx;
    const f = this.hz(m);
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(2600, t); lp.frequency.exponentialRampToValueAtTime(900, t + dur);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vel, t + 0.006);
    g.gain.exponentialRampToValueAtTime(vel * 0.3, t + 0.4);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    lp.connect(g); g.connect(this.master);
    [[1, 1], [2, 0.28], [3, 0.08]].forEach((h) => {
      const o = c.createOscillator(); o.type = 'sine'; o.frequency.value = f * h[0];
      const hg = c.createGain(); hg.gain.value = h[1];
      o.connect(hg); hg.connect(lp);
      o.start(t); o.stop(t + dur + 0.05);
    });
  }
  pianoChord(notes, t, vel, dur) {
    notes.forEach((m, i) => this.pianoNote(m, t + i * 0.018, vel, dur));
  }
  tap(t, vol, dur, freq) {
    const c = this.ctx;
    const s = c.createBufferSource(); s.buffer = this.noise;
    const f = c.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = freq;
    const g = c.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.master);
    s.start(t); s.stop(t + dur + 0.02);
  }
  scheduleBeat(i, t) {
    const spb = 60 / 80;
    const sw = spb * 2 / 3;
    const barIx = Math.floor(i / 4) % 8;
    const bar = this.bars()[barIx];
    const b = i % 4;
    this.tap(t, 0.014, 0.25, 7500);
    if (b === 1 || b === 3) {
      this.tap(t + sw, 0.01, 0.18, 7500);
      this.tap(t, 0.012, 0.05, 9500);
    }
    if (b === 0) {
      this.pianoNote(bar[0][0] + 12, t, 0.05, 2.4);
      this.pianoChord(bar[1], t + 0.03, 0.028, 2.2);
    }
    const v = Math.floor(i / 4) % 2;
    if (b === 2 && v === 0) this.pianoChord(bar[1], t + sw, 0.018, 1.2);
    if (b === 1 && v === 1) this.pianoChord(bar[1], t + sw, 0.018, 1.2);
  }
  schedule() {
    const c = this.ctx;
    if (!c || c.state !== 'running' || !this.musicLive) return;
    if (this.nextT < c.currentTime) this.nextT = c.currentTime + 0.05;
    while (this.nextT < c.currentTime + 0.3) {
      this.scheduleBeat(this.beat, this.nextT);
      this.beat = (this.beat + 1) % 32;
      this.nextT += 60 / 80;
    }
  }
  musicStart() {
    if (!this.state.music || !this.initAudio()) return;
    const c = this.ctx;
    try { c.resume(); } catch (e) {}
    if (!this.musicLive) {
      this.musicLive = true;
      this.beat = 0;
      this.nextT = c.currentTime + 0.1;
      this.master.gain.cancelScheduledValues(c.currentTime);
      this.master.gain.setValueAtTime(0.0001, c.currentTime);
      this.master.gain.exponentialRampToValueAtTime(0.55, c.currentTime + 1.5);
    }
  }
  musicStop(fade) {
    if (!this.ctx) return;
    const c = this.ctx;
    this.musicLive = false;
    const now = c.currentTime;
    this.master.gain.cancelScheduledValues(now);
    this.master.gain.setValueAtTime(Math.max(this.master.gain.value, 0.0001), now);
    this.master.gain.exponentialRampToValueAtTime(0.0001, now + (fade || 0.3));
  }
  musicPause() { if (this.ctx) { try { this.ctx.suspend(); } catch (e) {} } }
  musicResume() { if (this.ctx && this.state.music) { try { this.ctx.resume(); } catch (e) {} } }

  componentDidMount() {
    this.iv = setInterval(() => this.tick(), 200);
    this.au = setInterval(() => this.schedule(), 60);
  }
  componentWillUnmount() {
    clearInterval(this.iv); clearInterval(this.au); clearTimeout(this.to);
    if (this.ctx) { try { this.ctx.close(); } catch (e) {} }
  }
  tick() {
    const s = this.state;
    if (!s.playing || s.scene < 0) return;
    const d = this.durs();
    const el = s.el + 200;
    if (el >= d[s.scene]) {
      if (s.scene < d.length - 1) this.setState({ scene: s.scene + 1, el: 0 });
      else { this.setState({ el: d[s.scene], playing: false, ended: true }); this.musicStop(3); }
    } else {
      this.setState({ el: el });
    }
  }
  go(i, off) {
    off = off || 0;
    clearTimeout(this.to);
    this.musicStart();
    this.musicResume();
    this.setState({ scene: -1, el: 0 });
    this.to = setTimeout(() => {
      this.setState({ scene: i, el: off, started: true, playing: true, ended: false });
      if (off) setTimeout(() => this.sync(off), 60);
    }, 40);
  }
  sync(off) {
    try {
      const st = document.querySelector('.stage');
      if (!st || !st.getAnimations) return;
      st.getAnimations({ subtree: true }).forEach((a) => { try { a.currentTime = off; } catch (e) {} });
    } catch (e) {}
  }
  jump(delta) {
    const d = this.durs();
    const s = this.state;
    const cur = s.scene < 0 ? 0 : s.scene;
    let t = 0;
    for (let i = 0; i < cur; i++) t += d[i];
    t += (s.scene < 0 || !s.started) ? 0 : s.el;
    const total = d.reduce((a, b) => a + b, 0);
    t = Math.max(0, Math.min(t + delta, total - 500));
    let i = 0;
    while (i < d.length - 1 && t >= d[i]) { t -= d[i]; i++; }
    this.go(i, t);
  }
  fmt(ms) {
    const t = Math.floor(ms / 1000);
    const m = Math.floor(t / 60);
    const sec = t % 60;
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }
  renderVals() {
    const s = this.state;
    const d = this.durs();
    const total = d.reduce((a, b) => a + b, 0);
    const cur = s.scene < 0 ? 0 : s.scene;
    let done = 0;
    for (let i = 0; i < cur; i++) done += d[i];
    done += s.scene < 0 ? 0 : s.el;
    const vis = s.started ? s.scene : -2;
    const chapters = this.labels().map((label, i) => ({
      label: label,
      cls: s.started && i === cur ? 'on' : (s.started && i < cur ? 'done' : ''),
      go: () => this.go(i)
    }));
    return {
      s0: vis === 0, s1: vis === 1, s2: vis === 2, s3: vis === 3, s4: vis === 4, s5: vis === 5, s6: vis === 6, s7: vis === 7,
      showCover: !s.started,
      pauseCls: s.playing ? '' : 'paused',
      isPlaying: s.playing,
      notPlaying: !s.playing,
      playLabel: s.playing ? 'Pause' : (s.ended ? 'Replay' : 'Play'),
      progressW: (Math.min(1, done / total) * 100).toFixed(2) + '%',
      timeLabel: this.fmt(done) + ' / ' + this.fmt(total),
      chapters: chapters,
      steps: [1, 2, 3, 4, 5, 6, 7].map((n) => ({ n: n, on: s.started && s.scene >= 0 && s.scene === n })),
      showSubs: s.subsOn && s.started,
      subs: (() => {
        const L = s.scene >= 0 ? this.subLines()[s.scene] : [];
        let act = -1;
        L.forEach((c, i) => { if (s.el >= c[0]) act = i; });
        return L.map((c, i) => ({ text: c[1], on: i === act }));
      })(),
      subsOn: s.subsOn,
      subsLabel: s.subsOn ? 'Hide captions' : 'Show captions',
      subsColor: s.subsOn ? '#8FD16F' : '#A9B8CC',
      toggleSubs: () => this.setState({ subsOn: !this.state.subsOn }),
      musicOn: s.music,
      musicOff: !s.music,
      musicLabel: s.music ? 'Music on' : 'Music off',
      toggleMusic: () => {
        const on = !this.state.music;
        this.setState({ music: on }, () => {
          if (!on) this.musicStop(0.6);
          else if (this.state.playing) this.musicStart();
        });
      },
      togglePlay: () => {
        if (!this.state.started || this.state.ended) this.go(0);
        else {
          const playing = !this.state.playing;
          if (playing) this.musicResume(); else this.musicPause();
          this.setState({ playing: playing });
        }
      },
      replay: () => this.go(0),
      back10: () => this.jump(-10000),
      fwd10: () => this.jump(10000),
      prev: () => this.go(Math.max(0, cur - 1)),
      next: () => this.go(Math.min(d.length - 1, cur + 1))
    };
  }
}

Player.prototype.setState = function (obj, cb) { Object.assign(this.state, obj); this.render(); if (cb) cb(); };
Player.prototype.render = function () {
  const v = this.renderVals();
  const $ = (id) => document.getElementById(id);
  const s = this.state;
  const vis = s.started ? s.scene : -2;
  if (vis !== this._vis) {
    this._vis = vis;
    const tpl = $('scene-' + vis);
    $('sceneHost').innerHTML = tpl ? tpl.innerHTML : '';
  }
  $('stage').classList.toggle('paused', !s.playing);
  $('cover').hidden = !v.showCover;
  const st = v.steps.find((x) => x.on);
  const stn = st ? st.n : 0;
  if (stn !== this._step) { this._step = stn; $('steps').innerHTML = stn ? STEP_HTML.split('{{st.n}}').join(String(stn)) : ''; }
  const sb = v.showSubs ? v.subs.find((x) => x.on) : null;
  const key = sb ? s.scene + '|' + sb.text : '';
  if (key !== this._sub) {
    this._sub = key;
    $('subs').innerHTML = '';
    if (sb) { const d = document.createElement('div'); d.innerHTML = SUB_OPEN + '</div>'; d.firstChild.textContent = sb.text; $('subs').appendChild(d.firstChild); }
  }
  $('prog').style.width = v.progressW;
  $('timeLabel').textContent = v.timeLabel;
  $('playLabel').textContent = v.playLabel;
  $('playBtn').setAttribute('aria-label', v.playLabel);
  $('icoPause').hidden = !v.isPlaying; $('icoPlay').hidden = v.isPlaying;
  $('musicLabel').textContent = v.musicLabel; $('musicBtn').setAttribute('aria-label', v.musicLabel); $('musicBtn').setAttribute('aria-pressed', String(v.musicOn));
  $('icoMusicOn').hidden = !v.musicOn; $('icoMusicOff').hidden = v.musicOn;
  $('subsBtn').setAttribute('aria-label', v.subsLabel); $('subsBtn').setAttribute('aria-pressed', String(v.subsOn)); $('subsIcon').setAttribute('stroke', v.subsColor);
  const ck = v.chapters.map((c) => c.cls).join(',');
  if (ck !== this._chips) {
    this._chips = ck;
    const host = $('chapters'); host.innerHTML = '';
    v.chapters.forEach((c, i) => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'chip ' + c.cls; b.textContent = c.label;
      b.addEventListener('click', () => this.go(i)); host.appendChild(b);
    });
  }
};
const P = new Player();
const call = (k) => () => P.renderVals()[k]();
document.getElementById('coverPlay').addEventListener('click', call('togglePlay'));
document.getElementById('playBtn').addEventListener('click', call('togglePlay'));
document.getElementById('replayBtn').addEventListener('click', call('replay'));
document.getElementById('prevBtn').addEventListener('click', call('prev'));
document.getElementById('back10Btn').addEventListener('click', call('back10'));
document.getElementById('fwd10Btn').addEventListener('click', call('fwd10'));
document.addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft') { e.preventDefault(); call('back10')(); } else if (e.key === 'ArrowRight') { e.preventDefault(); call('fwd10')(); } else if (e.key === ' ' && e.target === document.body) { e.preventDefault(); call('togglePlay')(); } });
document.getElementById('nextBtn').addEventListener('click', call('next'));
document.getElementById('musicBtn').addEventListener('click', call('toggleMusic'));
document.getElementById('subsBtn').addEventListener('click', call('toggleSubs'));
P.render();
P.componentDidMount();

</script>
